<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen Island Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>Kitchen Island Leaderboard</h1>
    <p class="sub" id="sub"></p>
    <div class="tabs" id="tabs"></div>
    <div class="bar"><input id="q" placeholder="Search player…" autocomplete="off"></div>
    <div class="scroll">
      <div class="head">
        <span>#</span><span>Player</span><span>Kills</span><span>K/D</span>
        <span>Deaths</span><span>Rounds</span><span>XP</span><span>Level</span>
      </div>
      <div id="rows"></div>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
